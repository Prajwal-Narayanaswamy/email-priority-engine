name: ML Pipeline CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "Force model retraining regardless of drift"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.12"
  MLFLOW_TRACKING_URI: "http://localhost:5000"

jobs:

  # ── 1. Lint and format check ──────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dev dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run ruff
        run: ruff check src/ tests/

      - name: Check black formatting
        run: black --check src/ tests/

      - name: Check isort
        run: isort --check-only src/ tests/

  # ── 2. Unit tests ─────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── 3. Drift check + conditional retrain ─────────────────────
  retrain:
    name: Retrain if Drift Detected
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Check for drift alert
        id: drift_check
        run: |
          # Check if drift alert file exists (written by monitoring service)
          if [ -f "reports/drift/DRIFT_ALERT" ] || [ "${{ github.event.inputs.force_retrain }}" == "true" ]; then
            echo "retrain=true" >> $GITHUB_OUTPUT
            echo "Drift detected or forced retrain — retraining model"
          else
            echo "retrain=false" >> $GITHUB_OUTPUT
            echo "No drift detected — skipping retrain"
          fi

      - name: Run retraining pipeline
        if: steps.drift_check.outputs.retrain == 'true'
        run: |
          python -m src.flows.train_flow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

      - name: Promote model if it beats champion
        if: steps.drift_check.outputs.retrain == 'true'
        run: |
          python -m src.flows.promote_flow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

  # ── 4. Build and push Docker image ───────────────────────────
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api/Dockerfile
          push: false   # set to true and add registry credentials when ready
          tags: email-pipeline-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
