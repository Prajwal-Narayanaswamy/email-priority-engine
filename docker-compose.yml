# Serving only (ADR-015). The image is generic; the model bundle is mounted
# read-only. Export it first:  python -m scripts.export_model_bundle
# Monitoring services (mlflow server, prometheus, grafana) return in their own
# stage; prometheus/ and grafana/ are kept as scaffolding for it.
services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: email-priority-api:local
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      # create_host_path: false is set, but on Docker Desktop with WSL it does NOT
      # stop Docker creating an empty root-owned ./serving_bundle when the bundle
      # is missing (observed). Startup still fails safe: exit 3, "bundle file
      # manifest.json is missing in /bundle". Remove the stray directory with
      # `sudo rm -rf serving_bundle` and re-export.
      - type: bind
        source: ./serving_bundle
        target: /bundle
        read_only: true
        bind:
          create_host_path: false
    environment:
      MODEL_SOURCE: bundle
      MODEL_BUNDLE_DIR: /bundle
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
